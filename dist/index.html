#menu{height:140px;top:764px;border-radius:70px;background:var(--menu)}

#mlabel{position:absolute;font-size:36px;line-height:44px;letter-spacing:-.04em;color:var(--sel);white-space:nowrap;transform:translateX(-50%);unicode-bidi:plaintext;top:904px}
#hints{right:80px;top:992px;height:48px;display:flex;gap:40px;font-size:30px;line-height:48px;direction:ltr}

#ctl{left:79px;top:982px;width:110px;height:68px}

#pill{display:none;left:527px;top:298px;width:780px;height:135px;border-radius:68px;background:#ffffff30;border:2px solid #fff6;padding:20px 40px;font-size:36px;line-height:46px;backdrop-filter:blur(14px);unicode-bidi:plaintext}

body.glass .tile::before{background:#bff3ff}
body.glass .tile .img{font-size:26px;padding:16px;color:#fff}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#000c;color:#fff;padding:12px 26px;border-radius:30px;font-size:18px;display:none;z-index:20;max-width:80vw}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10}
