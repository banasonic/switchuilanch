<!doctype html><html lang="ar" dir="ltr"><meta charset="utf-8"><title>SW Launcher</title>
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#2f2f31;--tx:#fff;--dock:#3c3c3f;--slot:#39393b;--ac:#4cc3f0;--card:#4a4a4e;--sz:1}
body.light{--bg:#ebebeb;--tx:#222;--dock:#f4f4f4;--slot:#dedede;--ac:#2f6fe0;--card:#d6d6da}
body.glass{--tx:#fff;--ac:#bff3ff;--card:#ffffff40;--dock:#ffffff30;background:linear-gradient(#8fd3e8 0%,#d3eee8 42%,#f2e4b6 60%,#86cfc4 80%,#3f9fa8 100%)}
*{box-sizing:border-box}
body{margin:0;height:100vh;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;direction:ltr}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:2.5vh 4vw 0;height:14vh}
.av{position:relative;width:6vh;height:6vh;border-radius:50%;background:#fff;border:3px solid #ffffffaa;display:flex;align-items:center;justify-content:center;font-size:3vh;margin-top:2vh}
.av i{position:absolute;top:-2.2vh;font-style:normal;font-size:2vh;color:#34c759}
.mid{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:1vh}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:5px 15px;border-radius:20px;background:var(--dock);cursor:pointer;font-size:13px;border:2px solid transparent}
.chip.on{border-color:var(--tx)}.chip.off{opacity:.45}
.status{display:flex;gap:14px;align-items:center;margin-top:3vh;font-size:3.2vh;font-weight:500}
.status svg{width:3.6vh;height:3.6vh;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round}
#title{height:7vh;padding:0 6vw;font-size:3.4vh;color:var(--ac);display:flex;align-items:flex-end}
body.light #title,body.glass #title{visibility:hidden}
main{display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;padding:0 6vw;gap:1.6vw;scrollbar-width:none;flex:1;min-height:0}
main::-webkit-scrollbar{display:none}
.tile,.slot{flex:0 0 auto;width:calc(38vh*var(--sz));height:calc(38vh*var(--sz));border-radius:14px}
.slot{background:var(--slot);border:3px solid #ffffff12}
.tile{background:var(--card);position:relative;overflow:hidden;cursor:pointer;background-size:cover;background-position:center;display:flex;align-items:flex-end;justify-content:center;transition:.15s}
.tile span{width:100%;padding:10px;font-size:14px;font-weight:600;color:#fff;text-align:center;background:linear-gradient(transparent,#000b);opacity:0;word-break:break-word}
.tile span:first-child:not(:last-child){position:absolute;top:30%;left:0;font-size:6vh;background:none;opacity:1;padding:0}
.tile.sel{outline:4px solid var(--ac);outline-offset:-4px}
body.light .tile.sel span:last-child{opacity:1}
.cont{display:none}
.empty{margin:auto;color:#999;font-size:18px}
#pill{display:none}
.dockw{display:flex;flex-direction:column;align-items:center;height:17vh}
.dock{display:flex;gap:1.4vw;padding:1.2vh 1.8vw;border-radius:60px;background:var(--dock)}
.d{width:8.5vh;height:8.5vh;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.d svg{width:4.6vh;height:4.6vh;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.d.red{background:#e60012;color:#fff}
.d.sel::after{content:"";position:absolute;inset:-3px;border-radius:50%;padding:3px;pointer-events:none;background:conic-gradient(from var(--a),#4cc3f0,#8a6cf0,#f06ab4,#ffb36b,#4cc3f0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3.5s linear infinite}
@keyframes spin{to{--a:360deg}}
#dlabel{margin-top:1vh;font-size:3.2vh;color:var(--ac);height:4vh}
footer{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4vw 3vh;height:9vh}
.ctl{display:flex;flex-direction:column;gap:5px}.ctl svg{width:6vh;fill:var(--tx)}
.bars{display:flex;gap:4px}.bars i{width:1.3vh;height:1.3vh;background:#888;display:block}.bars i:first-child{background:#34c759}
.hints{display:flex;gap:2.4vw;font-size:3vh}.hints b{cursor:pointer;font-weight:400;display:flex;align-items:center;gap:8px}
.hints u{text-decoration:none;width:4vh;height:4vh;border-radius:50%;background:var(--tx);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:2.4vh;font-weight:700}
/* glass: vertical dock, portrait tiles, title pill */
.glass .chip,.glass .dock,.glass #pill,.glass .status{backdrop-filter:blur(14px)}
.glass .dockw{position:absolute;left:1.5vw;top:28vh;height:auto}
.glass .dock{flex-direction:column;gap:1.2vh;padding:2.6vh 1vh;border:1.5px solid #fff6}
.glass .d{color:#fff}.glass #dlabel{display:none}
.glass main{padding-left:14vw;align-items:flex-end;margin-bottom:6vh;flex:0 0 auto;height:44vh}
.glass .tile,.glass .slot{width:calc(23vh*var(--sz));height:calc(31vh*var(--sz));border:1.5px solid #fff5}
.glass .tile.sel{width:calc(30vh*var(--sz));height:calc(42vh*var(--sz));outline:4px solid #bff3ff;outline-offset:-4px}
.glass .tile.sel .cont{display:flex;position:absolute;bottom:0;left:0;right:0;padding:1.2vh 1.4vh;background:#0006;color:#fff;font-size:2.4vh;gap:8px;align-items:center}
.glass #pill{display:block;margin:2vh 0 2vh 14vw;width:fit-content;max-width:60vw;padding:1.6vh 3vh;border-radius:5vh;background:#ffffff30;border:1.5px solid #fff6;font-size:3.4vh;line-height:1.4}
.glass #pill small{font-size:2.4vh;display:block;opacity:.85}
.glass #title{display:none}
.glass .hints,.glass .status{color:#fff}.glass .ctl svg{fill:#fff}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
.modal>div{background:#2f2f31;color:#fff;padding:30px;border-radius:24px;width:460px;max-width:92vw}
.row{display:flex;justify-content:space-between;align-items:center;margin:16px 0;gap:10px;direction:rtl}
select,input[type=password]{background:#4a4a4e;color:#fff;border:0;border-radius:10px;padding:9px;width:200px}
.btn{background:#fff;color:#222;border:0;border-radius:20px;padding:9px 18px;cursor:pointer;font-weight:600}
</style>
<body>
<header><div class="av"><i>1</i>🎮</div><div class="mid"><div class="chips" id="disks"></div><div class="chips" id="parts"></div></div>
<div class="status"><svg viewBox="0 0 24 24"><path d="M2 9a14 14 0 0 1 20 0M5 12.5a9.5 9.5 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg><span id="clock"></span><svg viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4"/><rect x="4" y="9" width="14" height="6" fill="currentColor"/></svg></div></header>
<div id="title"></div><div id="pill"><div id="pn"></div><small id="pp"></small></div>
<main id="grid"></main>
<div class="dockw"><div class="dock" id="dock"></div><div id="dlabel"></div></div>
<footer><div class="ctl"><div class="bars"><i></i><i></i><i></i><i></i></div><svg viewBox="0 0 24 14"><path d="M5 1h14a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-3l-2-2h-4l-2 2H5a4 4 0 0 1-4-4V5a4 4 0 0 1 4-4z"/></svg></div><div class="hints" id="hints"></div></footer>
<div class="modal" id="set"><div>
 <h3>الإعدادات</h3>
 <div class="row">حجم الأيقونات<input type="range" min=".7" max="1.5" step=".1" id="isz" oninput="S.settings.size=+this.value;apply()"></div>
 <div class="row">الصوت<input type="checkbox" id="sndc" onchange="S.settings.sound=this.checked;apply()"></div>
 <div class="row">الثيم<select id="thm" onchange="S.settings.theme=this.value;apply()"><option value="dark">ليلي</option><option value="light">فاتح</option><option value="glass">زجاجي</option></select></div>
 <div class="row">مفتاح SteamGridDB<input type="password" id="key" onchange="S.settings.key=this.value;persist()"></div>
 <div class="row"><button class="btn" onclick="exportS()">حفظ الإعدادات</button><button class="btn" onclick="importS()">استعادة الإعدادات</button><button class="btn" onclick="closeSet()">إغلاق</button></div>
</div></div>
<script>
let S, live = [], cur = {disk: null, part: null}, sel = 0;
const $ = q => document.querySelector(q), api = window.api;
const AC = new (window.AudioContext || webkitAudioContext)();
function beep(f, d = .07) { if (!S.settings.sound) return; const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.value = f; g.gain.setValueAtTime(.08, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d); }
const persist = () => api.save(S);
function apply() { document.body.className = S.settings.theme === 'dark' ? '' : S.settings.theme;
  document.documentElement.style.setProperty('--sz', S.settings.size);
  persist(); }
async function init() {
  S = (await api.load()) || {settings: {sound: true, size: 1, theme: 'dark', key: ''}, disks: {}};
  live = await api.drives();
  for (const d of live) { const D = S.disks[d.name] ||= {parts: {}}; D.parts[d.letter] ||= {folders: []}; D.parts[d.letter].size = d.size; }
  cur.disk = Object.keys(S.disks)[0]; cur.part = cur.disk && Object.keys(S.disks[cur.disk].parts)[0];
  apply(); render();
  setInterval(() => $('#clock').textContent = new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'}), 1000);
}
const online = (n, l) => live.some(d => d.name === n && (!l || d.letter === l));
const F = () => (S.disks[cur.disk]?.parts[cur.part]?.folders) || [];
const IC = {
 add: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-width="2.4"/></svg>',
 scan: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="11" cy="11" r="4"/><path d="M14 14l4 4"/></svg>',
 cover: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 17l5-6 4 4 3-3 6 5"/></svg>',
 exe: '<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M10 8l5 4-5 4z"/></svg>',
 snd: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
 mute: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
 set: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" stroke-width="3" stroke-dasharray="2.9 2.9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2.3"/></svg>',
 pwr: '<svg viewBox="0 0 24 24"><path d="M7 6.3a8 8 0 1 0 10 0M12 3v8"/></svg>'
};
let dsel = -1, dock_ = true;
const DK = () => [
 {i: 'add', t: 'إضافة فولدر', c: '', cls: 'red', f: addOne}, {i: 'scan', t: 'فحص مجلد ألعاب', c: '#f59e0b', f: scanAdd},
 {i: 'cover', t: 'بوستر SteamGridDB', c: '#3b82f6', f: getCover}, {i: 'exe', t: 'ربط ملف التشغيل', c: '#22a45d', f: setExe},
 {i: S.settings.sound ? 'snd' : 'mute', t: 'الصوت', c: '#20b5c9', f: toggleSnd}, {i: 'set', t: 'الإعدادات', c: 'var(--tx)', f: openSet},
 {i: 'pwr', t: 'خروج', c: 'var(--tx)', f: () => window.close()}];
function render() {
  $('#disks').innerHTML = Object.keys(S.disks).map(n => `<div class="chip ${n === cur.disk ? 'on' : ''} ${online(n) ? '' : 'off'}" onclick="pickDisk('${n.replace(/'/g, "\\'")}')">💽 ${n}</div>`).join('');
  const P = S.disks[cur.disk]?.parts || {};
  $('#parts').innerHTML = Object.keys(P).map(l => `<div class="chip ${l === cur.part ? 'on' : ''} ${online(cur.disk, l) ? '' : 'off'}" onclick="pickPart('${l}')">${l}: ${P[l].size ? (P[l].size / 1e9).toFixed(0) + ' GB' : ''}</div>`).join('');
  const fs_ = F(); sel = Math.min(sel, Math.max(0, fs_.length - 1));
  const slots = fs_.length && fs_.length < 6 ? '<div class="slot"></div>'.repeat(6 - fs_.length) : '';
  $('#grid').innerHTML = fs_.length ? fs_.map((f, i) => `<div class="tile ${i === sel ? 'sel' : ''}" onclick="select(${i})" ondblclick="play()" style="${f.cover ? `background-image:url('file:///${f.cover.replace(/\\/g, '/')}')` : ''}">${f.cover ? '' : '<span>📁</span>'}<span>${f.name}</span><div class="cont"><u style="text-decoration:none;background:#fff;color:#222;border-radius:50%;width:3.4vh;height:3.4vh;display:inline-flex;align-items:center;justify-content:center;font-weight:700">A</u> تشغيل</div></div>`).join('') + slots : '<div class="empty">لا توجد مجلدات — اضغط زر الفحص في الشريط لإضافة مجلد ألعاب</div>';
  const cf = fs_[sel]; $('#title').textContent = cf ? cf.name : ''; $('#pn').textContent = cf ? cf.name : ''; $('#pp').textContent = cf ? cf.path : '';
  $('#hints').innerHTML = fs_.length ? `<b onclick="setExe()"><u>+</u>ربط exe</b><b onclick="del()"><u>X</u>حذف</b><b onclick="rename()"><u>Y</u>تسمية</b><b onclick="play()"><u>A</u>تشغيل</b>` : '';
  const dk = DK();
  $('#dock').innerHTML = dk.map((d, i) => `<div class="d ${d.cls || ''} ${i === dsel ? 'sel' : ''}" style="color:${d.c}" onmouseenter="hov(${i})" onclick="dk(${i})">${IC[d.i]}</div>`).join('');
  $('#dlabel').textContent = dsel >= 0 ? dk[dsel].t : '';
  document.querySelector('.tile.sel')?.scrollIntoView({inline: 'center', block: 'nearest'});
}
const hov = i => { if (dsel !== i) { dsel = i; beep(700, .04); render(); } };
const dk = i => { beep(900, .08); DK()[i].f(); };
const pickDisk = n => { cur.disk = n; cur.part = Object.keys(S.disks[n].parts)[0]; sel = 0; beep(520); render(); };
const pickPart = l => { cur.part = l; sel = 0; beep(560); render(); };
const select = i => { sel = i; beep(700, .04); render(); };
async function scanAdd() {
  const p = await api.pickFolder(); if (!p) return; beep(880);
  const list = await api.scan(p), arr = F();
  for (const x of list) if (!arr.some(f => f.path === x)) arr.push({path: x, name: x.split('\\').pop(), cover: '', exe: ''});
  persist(); render();
}
async function addOne() { const p = await api.pickFolder(); if (!p) return; F().push({path: p, name: p.split('\\').pop(), cover: '', exe: ''}); persist(); render(); }
async function play() { const f = F()[sel]; if (!f) return; beep(900, .12); f.exe ? api.launch(f.exe) : api.open(f.path); }
async function setExe() { const e = await api.pickExe(); if (e) { F()[sel].exe = e; persist(); beep(800); } }
async function getCover() {
  if (!S.settings.key) { alert('ضع مفتاح SteamGridDB من الإعدادات أولاً'); return openSet(); }
  const f = F()[sel], r = await api.sgdb(f.name, S.settings.key, S.settings.theme === 'glass' ? '600x900' : '1024x1024,512x512');
  if (r.file) { f.cover = r.file; persist(); render(); } else alert(r.error);
}
function rename() { const f = F()[sel], n = prompt('الاسم الجديد (داخل الواجهة فقط)', f.name); if (n) { f.name = n; persist(); render(); } }
function del() { if (confirm('حذف من الواجهة فقط؟ (الفولدر الحقيقي لا يتأثر)')) { F().splice(sel, 1); persist(); render(); } }
const toggleSnd = () => { S.settings.sound = !S.settings.sound; apply(); render(); beep(600); };
function openSet() { $('#isz').value = S.settings.size; $('#sndc').checked = S.settings.sound; $('#thm').value = S.settings.theme; $('#key').value = S.settings.key || ''; $('#set').style.display = 'flex'; beep(660); }
const closeSet = () => { $('#set').style.display = 'none'; beep(440); };
function exportS() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)])); a.download = 'launcher-backup.json'; a.click(); }
function importS() { const i = document.createElement('input'); i.type = 'file'; i.onchange = async () => { S = JSON.parse(await i.files[0].text()); apply(); render(); }; i.click(); }
addEventListener('keydown', e => { const n = F().length;
  if (e.key === 'ArrowDown') { dsel = Math.max(dsel, 0); render(); return; }
  if (e.key === 'ArrowUp') { dsel = -1; render(); return; }
  if (dsel >= 0) { if (e.key === 'ArrowRight') { dsel = Math.min(6, dsel + 1); render(); } if (e.key === 'ArrowLeft') { dsel = Math.max(0, dsel - 1); render(); } if (e.key === 'Enter') dk(dsel); return; }
  if (e.key === 'ArrowRight') select(Math.min(n - 1, sel + 1)); if (e.key === 'ArrowLeft') select(Math.max(0, sel - 1));
  if (e.key === 'Enter' || e.key === 'a') play(); if (e.key === 'x' || e.key === 'Delete') del(); if (e.key === 'y' || e.key === 'F2') rename(); if (e.key === '+' || e.key === '=') setExe();
  if (e.key === 'Escape') closeSet(); });
init();
</script></body></html>
